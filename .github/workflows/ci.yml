name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with: { version: 10.4.1 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - name: Verify pinned company notification handlers with fake SMTP
        run: |
          COMPANY_SOURCE="$RUNNER_TEMP/company-native-source"
          git init "$COMPANY_SOURCE"
          git -C "$COMPANY_SOURCE" remote add origin https://github.com/documenso/documenso.git
          git -C "$COMPANY_SOURCE" fetch --depth 1 origin 389390c884949fe27c240488a3259da3cdba93e0
          git -C "$COMPANY_SOURCE" checkout --detach FETCH_HEAD
          node apps/company-documenso/prepare.mjs "$COMPANY_SOURCE"
          node apps/company-documenso/verify-handlers.mjs "$COMPANY_SOURCE"
      - run: pnpm build
      - run: pnpm audit --audit-level high
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/*/dist
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Scan repository history
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.0
        with:
          args: git --redact --verbose --no-banner /github/workspace

  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/cli@v2
        with:
          inlineScript: |
            set -eu
            for template in signing-platform database-bootstrap documenso-runtime bridge-runtime native-bootstrap; do
              az bicep build --file "infra/${template}.bicep" --stdout > /dev/null
            done
