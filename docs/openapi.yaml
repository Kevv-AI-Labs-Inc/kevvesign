openapi: 3.1.0
info:
  title: Internal E-Sign API
  version: 2026-08-01
  description: Workspace-scoped API for private real-estate and ordinary HR electronic signatures.
servers:
  - url: https://api.esign.example/v1
security:
  - oidcBearer: []
  - staffSession: []
paths:
  /me:
    get:
      operationId: getCurrentStaff
      responses:
        '200': { $ref: '#/components/responses/StaffResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /dashboard:
    get:
      operationId: getWorkspaceDashboard
      responses:
        '200': { description: Workspace dashboard }
  /signing-engine/health:
    get:
      operationId: getSigningEngineHealth
      responses:
        '200': { description: Configured signing-engine reachability }
  /application-clients:
    get:
      operationId: listApplicationClients
      description: Staff-only workspace administration operation.
      responses:
        '200': { description: Application clients without credential hashes }
    post:
      operationId: createApplicationClient
      description: Staff-only operation. The plaintext credential is returned once and never stored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateApplicationClient' }
      responses:
        '201':
          description: Application client and one-time credential
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /application-clients/{clientId}/rotate:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    post:
      operationId: rotateApplicationClient
      description: Staff-only operation. Invalidates the previous credential immediately.
      responses:
        '200': { description: Rotated one-time credential }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }
  /application-clients/{clientId}/revoke:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    post:
      operationId: revokeApplicationClient
      description: Staff-only operation. Revocation is immediate.
      responses:
        '200': { description: Revoked client metadata }
        '404': { $ref: '#/components/responses/NotFound' }
  /integration-sessions:
    post:
      operationId: createIntegrationSession
      security:
        - applicationKey: []
      description: >-
        Called only by a source project's backend. Creates a five-minute, one-time launch URL whose
        ticket is carried in the URL fragment and therefore is not sent in HTTP request logs.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateIntegrationSession' }
      responses:
        '201': { description: Short-lived connected-system launch URL and expiration }
        '403': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /integration-sessions/exchange:
    post:
      operationId: exchangeIntegrationSession
      security: []
      description: Exchanges the one-time launch ticket for a bounded HttpOnly staff session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket]
              properties: { ticket: { type: string, minLength: 30, maxLength: 200 } }
      responses:
        '200': { description: Delegated staff context, destination, and staff-session cookies }
        '410': { description: Launch unavailable without context disclosure }
  /integration-sessions/logout:
    post:
      operationId: endIntegrationSession
      security:
        - staffSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200': { description: Session revoked and registered source return URL returned }
  /signing-engine/webhooks/documenso:
    post:
      operationId: receiveDocumensoEvent
      security:
        - documensoWebhookSecret: []
      description: Authenticated, replay-safe lifecycle projection from Documenso.
      responses:
        '200': { description: Event accepted or already processed }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /templates:
    get:
      operationId: listTemplates
      security:
        - oidcBearer: []
        - applicationKey: []
      description: Application credentials require `templates:read`.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: Template collection }
    post:
      operationId: createTemplate
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [metadata, pdf]
              properties:
                metadata: { type: string, contentMediaType: application/json }
                pdf: { type: string, format: binary }
      responses:
        '201':
          {
            description: Draft template created,
            headers: { Location: { schema: { type: string } } },
          }
        '413': { $ref: '#/components/responses/FileTooLarge' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /templates/{templateId}:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
    get:
      operationId: getTemplate
      security:
        - oidcBearer: []
        - applicationKey: []
      description: Application credentials require `templates:read`.
      responses:
        '200': { description: Template and immutable versions }
        '404': { $ref: '#/components/responses/NotFound' }
  /templates/{templateId}/versions/{versionId}:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
      - $ref: '#/components/parameters/VersionId'
    patch:
      operationId: updateTemplateDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateDraft' }
      responses:
        '200': { description: Draft updated }
        '409': { $ref: '#/components/responses/StateConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /templates/{templateId}/versions/{versionId}/publish:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
      - $ref: '#/components/parameters/VersionId'
    post:
      operationId: publishTemplateVersion
      responses:
        '200': { description: Immutable version published }
        '409': { $ref: '#/components/responses/StateConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /transactions:
    get:
      operationId: listTransactions
      security:
        - oidcBearer: []
        - applicationKey: []
      description: Application credentials require `transactions:read`.
      responses:
        '200': { description: Transaction folders }
    post:
      operationId: createTransaction
      security:
        - oidcBearer: []
        - applicationKey: []
      description: Application credentials require `transactions:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTransaction' }
      responses:
        '201': { description: Transaction created }
        '409': { $ref: '#/components/responses/StateConflict' }
  /envelopes:
    get:
      operationId: listEnvelopes
      security:
        - oidcBearer: []
        - applicationKey: []
      description: Application credentials require `envelopes:read`.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: Envelope collection }
    post:
      operationId: createEnvelope
      security:
        - oidcBearer: []
        - applicationKey: []
      description: Application credentials require `envelopes:write`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEnvelope' }
      responses:
        '201': { description: Prepared envelope created }
        '409': { $ref: '#/components/responses/StateConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /envelopes/{envelopeId}:
    parameters:
      - $ref: '#/components/parameters/EnvelopeId'
    get:
      operationId: getEnvelope
      security:
        - oidcBearer: []
        - applicationKey: []
      description: Application credentials require `envelopes:read`.
      responses:
        '200': { description: Envelope }
        '404': { $ref: '#/components/responses/NotFound' }
  /envelopes/{envelopeId}/approve:
    parameters:
      - $ref: '#/components/parameters/EnvelopeId'
    post:
      operationId: approveEnvelope
      responses:
        '200': { description: Envelope approved }
        '409': { $ref: '#/components/responses/StateConflict' }
  /envelopes/{envelopeId}/send:
    parameters:
      - $ref: '#/components/parameters/EnvelopeId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: sendEnvelope
      security:
        - oidcBearer: []
        - applicationKey: []
      description: Application credentials require `envelopes:send`.
      responses:
        '200': { description: Envelope sent or moved to approval pending }
        '409': { $ref: '#/components/responses/StateConflict' }
  /envelopes/{envelopeId}/void:
    parameters:
      - $ref: '#/components/parameters/EnvelopeId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: voidEnvelope
      security:
        - oidcBearer: []
        - applicationKey: []
      description: Application credentials require `envelopes:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: { reason: { type: string, minLength: 3, maxLength: 500 } }
      responses:
        '200': { description: Envelope voided }
  /envelopes/{envelopeId}/recipients/{recipientId}/resend:
    parameters:
      - $ref: '#/components/parameters/EnvelopeId'
      - name: recipientId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: resendInvitation
      security:
        - oidcBearer: []
        - applicationKey: []
      description: Application credentials require `envelopes:send`.
      responses:
        '200': { description: New invitation delivery queued }
  /envelopes/{envelopeId}/evidence:
    parameters:
      - $ref: '#/components/parameters/EnvelopeId'
    get:
      operationId: getEvidencePackage
      security:
        - oidcBearer: []
        - applicationKey: []
      description: Application credentials require `evidence:read`.
      responses:
        '200': { description: Evidence metadata }
        '409': { description: Finalization is not complete }
  /invitations/{token}:
    security: []
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string, minLength: 30, maxLength: 200 }
    get:
      operationId: inspectInvitation
      description: Side-effect-free and safe for mail-security scanner prefetch.
      responses:
        '200': { description: Generic availability response }
  /signing/session/exchange:
    security: []
    post:
      operationId: exchangeInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 30 }
                accessCode: { type: string, maxLength: 32 }
      responses:
        '200': { description: HttpOnly recipient session and signing context }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410': { description: Invitation unavailable without envelope information leakage }
  /signing/consent:
    security:
      - recipientSession: []
    post:
      operationId: acceptDisclosure
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200': { description: Consent recorded }
  /signing/progress:
    security:
      - recipientSession: []
    post:
      operationId: saveSigningProgress
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200': { description: Progress saved }
        '409': { $ref: '#/components/responses/StateConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /signing/finish:
    security:
      - recipientSession: []
    post:
      operationId: finishRecipient
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200': { description: Recipient frozen and next route/finalization activated }
        '422': { $ref: '#/components/responses/ValidationError' }
components:
  securitySchemes:
    oidcBearer: { type: http, scheme: bearer, bearerFormat: JWT }
    applicationKey:
      type: apiKey
      in: header
      name: X-ESign-Key
      description: Workspace-scoped credential formatted as `<client UUID>.<secret>`.
    recipientSession:
      type: apiKey
      in: cookie
      name: esign_recipient
    staffSession:
      type: apiKey
      in: cookie
      name: esign_staff
      description: Short-lived session issued from a one-time connected-system handoff.
    documensoWebhookSecret:
      type: apiKey
      in: header
      name: X-Documenso-Secret
  parameters:
    Cursor: { name: cursor, in: query, schema: { type: string, maxLength: 500 } }
    Limit:
      { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
    IdempotencyKey:
      {
        name: Idempotency-Key,
        in: header,
        required: true,
        schema: { type: string, minLength: 8, maxLength: 160 },
      }
    CsrfToken:
      { name: X-CSRF-Token, in: header, required: true, schema: { type: string, minLength: 20 } }
    TemplateId:
      { name: templateId, in: path, required: true, schema: { type: string, format: uuid } }
    VersionId: { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
    EnvelopeId:
      { name: envelopeId, in: path, required: true, schema: { type: string, format: uuid } }
    ClientId: { name: clientId, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
            details:
              type: array
              items:
                type: object
                required: [field, message, code]
                properties:
                  field: { type: string }
                  message: { type: string }
                  code: { type: string }
    Staff:
      type: object
      required: [id, email, displayName, role, workspaceId]
      properties:
        id: { type: string, maxLength: 120 }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { enum: [platform_admin, workspace_admin, preparer, approver, auditor] }
        workspaceId: { type: string, format: uuid }
        actorType: { enum: [staff, integration] }
        sourceApplicationClientId: { type: string, format: uuid }
        sourceApplicationName: { type: string }
        returnUrl: { type: string, format: uri }
    TemplateDraft:
      type: object
      required: [roles, fields]
      properties:
        roles: { type: array, minItems: 1, maxItems: 30, items: { type: object } }
        fields: { type: array, maxItems: 1000, items: { type: object } }
    CreateTransaction:
      type: object
      required: [kind, name, jurisdiction]
      properties:
        kind: { enum: [PROPERTY, HR_PACKET] }
        name: { type: string, minLength: 2, maxLength: 180 }
        jurisdiction: { enum: [NY, NJ, CA, NONE] }
        externalReference: { type: string, maxLength: 120 }
        propertyAddress: { type: string, maxLength: 300 }
    CreateEnvelope:
      type: object
      required: [templateId, subject, expiresAt, recipients]
      properties:
        templateId: { type: string, format: uuid }
        transactionId: { type: string, format: uuid }
        externalReference: { type: string, maxLength: 120 }
        subject: { type: string, minLength: 2, maxLength: 180 }
        message: { type: string, maxLength: 2000 }
        expiresAt: { type: string, format: date-time }
        recipients: { type: array, minItems: 1, maxItems: 50, items: { type: object } }
        mergeData: { type: object, additionalProperties: true }
    CreateApplicationClient:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        connectorKey: { type: string, minLength: 2, maxLength: 80, pattern: '^[a-z0-9][a-z0-9-]*$' }
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            enum:
              - templates:read
              - templates:write
              - transactions:read
              - transactions:write
              - envelopes:read
              - envelopes:write
              - envelopes:send
              - evidence:read
              - integration-sessions:create
        allowedReturnUrls:
          type: array
          maxItems: 10
          uniqueItems: true
          items: { type: string, format: uri, maxLength: 500 }
        expiresAt: { type: string, format: date-time }
    CreateIntegrationSession:
      type: object
      required: [actor, intent, returnUrl]
      properties:
        actor:
          type: object
          required: [subject, email, displayName, role]
          properties:
            subject: { type: string, minLength: 1, maxLength: 120 }
            email: { type: string, format: email, maxLength: 254 }
            displayName: { type: string, minLength: 1, maxLength: 160 }
            role: { enum: [preparer, approver, auditor] }
        intent:
          oneOf:
            - { type: object, required: [kind], properties: { kind: { const: dashboard } } }
            - type: object
              required: [kind]
              properties:
                kind: { const: prepare-envelope }
                templateId: { type: string, format: uuid }
            - type: object
              required: [kind, templateId]
              properties:
                kind: { const: edit-template }
                templateId: { type: string, format: uuid }
            - type: object
              required: [kind, envelopeId]
              properties:
                kind: { const: view-envelope }
                envelopeId: { type: string, format: uuid }
        returnUrl: { type: string, format: uri, maxLength: 500 }
  responses:
    StaffResponse:
      description: Current staff principal
      content:
        {
          application/json:
            {
              schema:
                { type: object, properties: { data: { $ref: '#/components/schemas/Staff' } } },
            },
        }
    Unauthorized:
      {
        description: Authentication required,
        content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
      }
    NotFound:
      {
        description: Resource not found without cross-workspace disclosure,
        content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
      }
    StateConflict:
      {
        description: State or idempotency conflict,
        content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
      }
    ValidationError:
      {
        description: Safe field-level validation error,
        content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
      }
    FileTooLarge:
      {
        description: Upload exceeds policy,
        content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
      }
